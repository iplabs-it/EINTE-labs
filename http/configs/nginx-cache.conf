worker_processes 1;
# OpenResty's image has no /var/log/nginx by default. Log to stderr/stdout
# so the container can start without an init step.
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format cache_log '$remote_addr - [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         'CACHE:$upstream_cache_status '
                         'rt=$request_time uct="$upstream_connect_time" '
                         'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /dev/stdout cache_log;

    sendfile on;
    keepalive_timeout 65;

    # Cache configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=http_cache:10m
                     max_size=100m inactive=60m use_temp_path=off;

    # Use Docker's embedded DNS (127.0.0.11) and resolve the origin name
    # at request time via a variable in proxy_pass. Resolving at config
    # parse time races with containerlab's /etc/hosts setup on a fresh
    # `containerlab deploy`, which otherwise fails with
    # "host not found in upstream webserver:80".
    resolver 127.0.0.11 valid=30s ipv6=off;

    # RFC 7234 Age header. Stock nginx does not synthesize Age when serving
    # from proxy_cache. We compute it from the X-Origin-Time header that the
    # origin server stamps onto every response (epoch seconds with fractional
    # precision). Because proxy_cache stores upstream response headers
    # verbatim, the cached X-Origin-Time still reflects the original origin
    # time on subsequent HITs, so Age = now - origin_time is correct.
    #
    # On revalidation (origin answers 304) nginx keeps the originally stored
    # headers, so X-Origin-Time alone would make Age keep growing past
    # max-age on a freshly revalidated entry. We therefore also remember, per
    # cache key, when the entry was last fetched or revalidated.
    lua_shared_dict cache_born 1m;

    header_filter_by_lua_block {
        -- The internal revalidation hop (port 8081, see below) only passes
        -- responses through to the cache; leave them untouched.
        if ngx.var.server_port == "8081" then return end

        local status = ngx.var.upstream_cache_status
        local key = ngx.var.scheme .. ngx.var.host .. ngx.var.request_uri
        local born = ngx.shared.cache_born
        local origin_time = tonumber(ngx.resp.get_headers()["X-Origin-Time"])

        if status == "MISS" or status == "EXPIRED" then
            -- fresh copy from the origin
            born:set(key, origin_time or ngx.now())
        elseif status == "REVALIDATED" then
            -- stored copy confirmed by the origin just now (304)
            born:set(key, ngx.now())
        end

        if status == "HIT" or status == "STALE" or status == "UPDATING"
           or status == "REVALIDATED" then
            local t = born:get(key) or origin_time
            if t then
                local age = math.floor(ngx.now() - t)
                if age < 0 then age = 0 end
                ngx.header["Age"] = tostring(age)
            end
        end
        -- Don't leak the internal stamp to clients.
        ngx.header["X-Origin-Time"] = nil
    }

    server {
        listen 80;
        listen [::]:80;
        server_name cache-proxy;

        # Add cache status header - crucial for lab exercises!
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Proxy-Name "ITLabs-CacheProxy/1.0" always;

        location / {
            set $origin webserver;
            proxy_pass http://$origin:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            # Enable caching
            proxy_cache http_cache;
            proxy_cache_valid 200 301 302 10m;
            proxy_cache_valid 404 1m;

            # Cache key. No $request_method: nginx turns HEAD into GET
            # upstream (proxy_cache_convert_head), so `curl -I` and `curl`
            # share one cache entry.
            proxy_cache_key $scheme$host$request_uri;

            # Respect origin cache headers
            proxy_cache_revalidate on;
            # No "updating" here: it would let nginx serve stale content for
            # as long as it likes while refreshing, overriding the origin's
            # stale-while-revalidate=N window (seen as STALE with Age far
            # beyond max-age + N). Without it nginx honours the header.
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            # Pass through cache-control from origin
            proxy_ignore_headers Set-Cookie;
        }

        # Cache-Control: no-cache means "may store, but must revalidate with
        # the origin before every reuse". Stock nginx simply refuses to store
        # such responses (always MISS, and client conditionals get a full
        # 200). To show the real semantics, /validate/ goes through an
        # internal hop that marks each response as already expired
        # (X-Accel-Expires, never sent to clients): the entry is stored, and
        # every request revalidates it -> X-Cache-Status: REVALIDATED, and a
        # client's If-None-Match is answered 304 from the cache.
        location /validate/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_cache http_cache;
            proxy_cache_key $scheme$host$request_uri;
            proxy_cache_revalidate on;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
        }

        # API - never cache
        location /api/ {
            set $origin webserver;
            proxy_pass http://$origin:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            # A location with its own add_header does not inherit the
            # server-level ones, so repeat X-Proxy-Name here.
            add_header X-Cache-Status "BYPASS-API" always;
            add_header X-Proxy-Name "ITLabs-CacheProxy/1.0" always;
        }

        # Cache status endpoint
        location /cache-status {
            return 200 'Cache proxy is running\nCache zone: http_cache\nMax size: 100m\n';
            add_header Content-Type text/plain;
        }

        # Purge cache (simplified - for demonstration)
        location /purge {
            # In production, this would actually purge, here we just acknowledge
            return 200 '{"status": "purge_requested", "note": "Demo mode - cache cleared on restart"}';
            add_header Content-Type application/json;
        }
    }

    # Internal hop for /validate/ (see above): forwards to the origin,
    # passing conditional requests through, and marks every response as
    # expired so the cache in front stores it but always revalidates.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location / {
            set $origin webserver;
            proxy_pass http://$origin:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            add_header X-Accel-Expires "@1" always;
        }
    }
}
