worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format ssl_log '$remote_addr - [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       'ssl_protocol=$ssl_protocol ssl_cipher=$ssl_cipher';

    access_log /var/log/nginx/access.log ssl_log;

    sendfile on;
    keepalive_timeout 65;

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name https-server secure.lab.local;
        root /usr/share/nginx/html;

        # SSL Configuration
        # server-chain.crt is the leaf + CA bundle so clients see the full
        # chain (B1.3 expects 2 certificates). Generated by generate-certs.sh.
        ssl_certificate /etc/nginx/certs/server-chain.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Modern SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL session settings
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Security headers.
        # NOTE: nginx `add_header` does NOT inherit into a child block once
        # that child defines any add_header of its own (even with `always`),
        # so the security headers MUST be repeated inside every location that
        # uses add_header. The shared snippet at /etc/nginx/snippets/security-headers.conf
        # makes this less repetitive.
        include /etc/nginx/snippets/security-headers.conf;

        # Main location
        location / {
            include /etc/nginx/snippets/security-headers.conf;
            index index.html;
            # `expires` sets Cache-Control without using add_header, so it
            # does NOT break add_header inheritance — but we still re-include
            # the snippet for safety.
            expires 5m;
        }

        # Endpoint to show connection info
        location /connection-info {
            include /etc/nginx/snippets/security-headers.conf;
            default_type text/plain;
            return 200 'SSL Protocol: $ssl_protocol\nSSL Cipher: $ssl_cipher\nSSL Session Reused: $ssl_session_reused\n';
        }

        # Sensitive data simulation
        location /secure-data/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "private, no-store" always;
            add_header X-Sensitive "true" always;
        }

        error_page 404 /404.html;
    }

    # HTTP redirect (for demonstration of redirect behavior)
    server {
        listen 80;
        server_name https-server secure.lab.local;

        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }
}
