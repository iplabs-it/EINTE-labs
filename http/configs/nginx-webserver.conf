worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format detailed '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'cache_control="$sent_http_cache_control" '
                        'etag="$sent_http_etag"';

    access_log /var/log/nginx/access.log detailed;

    sendfile on;
    keepalive_timeout 65;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
    gzip_vary on;

    server {
        listen 80;
        server_name webserver;
        root /usr/share/nginx/html;

        # Stamp every response with the origin time (epoch seconds, fractional).
        # The cache-proxy uses this to synthesize the Age header on HITs.
        # Note: nginx `add_header` does NOT inherit into child blocks once the
        # child defines any add_header of its own, so we re-list the common
        # headers (X-Origin-Time, X-Server-Name) inside each location below.
        add_header X-Server-Name "ITLabs-WebServer/1.0" always;
        add_header X-Origin-Time $msec always;

        # Main page - moderate caching
        location = /index.html {
            add_header X-Server-Name "ITLabs-WebServer/1.0" always;
            add_header X-Origin-Time $msec always;
            add_header Cache-Control "public, max-age=300";
            add_header X-Cache-Strategy "moderate";
            etag on;
        }

        # Static assets - aggressive caching (images, css, js)
        location /static/ {
            add_header X-Server-Name "ITLabs-WebServer/1.0" always;
            add_header X-Origin-Time $msec always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Strategy "aggressive-immutable";
            etag on;
        }

        # Dynamic content simulation - no caching.
        # We rely on add_header alone (no `expires 0`) to avoid emitting
        # two Cache-Control headers.
        location /dynamic/ {
            add_header X-Server-Name "ITLabs-WebServer/1.0" always;
            add_header X-Origin-Time $msec always;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Cache-Strategy "no-cache";
            add_header Pragma "no-cache";
            etag off;
        }

        # Private content - cached only in browser, not proxies
        location /private/ {
            add_header X-Server-Name "ITLabs-WebServer/1.0" always;
            add_header X-Origin-Time $msec always;
            add_header Cache-Control "private, max-age=600";
            add_header X-Cache-Strategy "private-only";
            etag on;
        }

        # Validation-required content
        location /validate/ {
            add_header X-Server-Name "ITLabs-WebServer/1.0" always;
            add_header X-Origin-Time $msec always;
            add_header Cache-Control "no-cache";
            add_header X-Cache-Strategy "must-revalidate";
            etag on;
        }

        # Short-lived content
        location /news/ {
            add_header X-Server-Name "ITLabs-WebServer/1.0" always;
            add_header X-Origin-Time $msec always;
            add_header Cache-Control "public, max-age=60, stale-while-revalidate=30";
            add_header X-Cache-Strategy "short-lived-swr";
            etag on;
        }

        # API endpoints - simulated REST API.
        # Use default_type for JSON (instead of add_header Content-Type)
        # so we don't emit two Content-Type headers.
        location /api/ {
            default_type application/json;
            add_header X-Server-Name "ITLabs-WebServer/1.0" always;
            add_header X-Origin-Time $msec always;
            add_header Cache-Control "no-store";
            add_header X-API-Version "1.0";

            location = /api/time {
                default_type application/json;
                add_header X-Server-Name "ITLabs-WebServer/1.0" always;
                add_header X-Origin-Time $msec always;
                add_header Cache-Control "no-store";
                add_header X-API-Version "1.0";
                return 200 '{"timestamp": "$time_iso8601", "server": "webserver"}';
            }

            location = /api/echo {
                default_type application/json;
                add_header X-Server-Name "ITLabs-WebServer/1.0" always;
                add_header X-Origin-Time $msec always;
                add_header Cache-Control "no-store";
                add_header X-API-Version "1.0";
                return 200 '{"method": "$request_method", "uri": "$request_uri", "headers": {"host": "$host", "user-agent": "$http_user_agent"}}';
            }

            location = /api/items {
                default_type application/json;
                add_header X-Server-Name "ITLabs-WebServer/1.0" always;
                add_header X-Origin-Time $msec always;
                add_header Cache-Control "no-store";
                add_header X-API-Version "1.0";
                if ($request_method = GET) {
                    return 200 '{"items": [{"id": 1, "name": "Widget"}, {"id": 2, "name": "Gadget"}, {"id": 3, "name": "Gizmo"}]}';
                }
                if ($request_method = POST) {
                    return 201 '{"status": "created", "id": 4, "message": "Item created successfully"}';
                }
                if ($request_method = DELETE) {
                    return 200 '{"status": "deleted", "message": "Item removed"}';
                }
                return 405 '{"error": "Method not allowed"}';
            }

            location ~ ^/api/items/(\d+)$ {
                default_type application/json;
                add_header X-Server-Name "ITLabs-WebServer/1.0" always;
                add_header X-Origin-Time $msec always;
                add_header Cache-Control "no-store";
                add_header X-API-Version "1.0";
                if ($request_method = GET) {
                    return 200 '{"id": $1, "name": "Item-$1", "description": "Details for item $1"}';
                }
                if ($request_method = PUT) {
                    return 200 '{"status": "updated", "id": $1}';
                }
                if ($request_method = DELETE) {
                    return 200 '{"status": "deleted", "id": $1}';
                }
            }
        }

        # Default - standard caching with ETag
        location / {
            etag on;
            add_header X-Server-Name "ITLabs-WebServer/1.0" always;
            add_header X-Origin-Time $msec always;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Cache-Strategy "default";
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }
}
