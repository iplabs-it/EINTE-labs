<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="#f8f9fa"/>
  
  <!-- Client -->
  <rect x="50" y="100" width="120" height="80" rx="10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="110" y="145" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">Client</text>
  <text x="110" y="165" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">curl / browser</text>
  
  <!-- Cache Proxy -->
  <rect x="280" y="100" width="120" height="80" rx="10" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="340" y="145" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">Cache Proxy</text>
  <text x="340" y="165" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">nginx</text>
  
  <!-- Web Server -->
  <rect x="510" y="100" width="120" height="80" rx="10" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="570" y="145" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">Web Server</text>
  <text x="570" y="165" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">nginx</text>
  
  <!-- HTTPS Server -->
  <rect x="510" y="200" width="120" height="60" rx="10" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="570" y="235" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">HTTPS</text>
  
  <!-- Arrows -->
  <line x1="170" y1="140" x2="270" y2="140" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="140" x2="500" y2="140" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="160" x2="200" y2="160" stroke="#e74c3c" stroke-width="2"/>
  <line x1="200" y1="160" x2="200" y2="230" stroke="#e74c3c" stroke-width="2"/>
  <line x1="200" y1="230" x2="500" y2="230" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Labels -->
  <text x="220" y="125" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="11">HTTP</text>
  <text x="450" y="125" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="11">HTTP</text>
  <text x="350" y="250" text-anchor="middle" fill="#c0392b" font-family="sans-serif" font-size="11">HTTPS/TLS</text>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#2c3e50" font-family="sans-serif" font-size="18" font-weight="bold">HTTP Lab Network Topology</text>
</svg>
